<html>

<head>
    <title>GameLoop</title>
    <style>
        * {
            margin:0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="canv">
    </canvas>
    <script src="Vector2.js"></script>
    <script>
        let canvas = document.querySelector("#canv")
        let ctx = canvas.getContext("2d")


        // set the position of the object
        let position = new Vector2(250, 250)

        // yarg this be the game loop
        function gameLoop() {
            update()
            draw()
            requestAnimationFrame(gameLoop)
        }

        // update loop
        function update() {
            position.x += 0.1
        }

        function draw() {
            // expand canvas
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight
            
            // signal to context i am going to draw something
            ctx.save()

            // set Center of object
            ctx.translate(position.x, position.y)
            // draw a shape at the center
            ctx.lineTo(0, -100)
            ctx.lineTo(-80, 50)
            ctx.lineTo(-40, 100)
            ctx.lineTo(40, 100)
            ctx.lineTo(80, 50)

            ctx.fillStyle = "turquoise"
            ctx.fill()
            // signal that i am done drawing 
            ctx.restore()
        }
        // bad for loop, big no no
        /*
        for (let i = 0; i < 10; i++) {
            update()
            draw()
        }
        */
    requestAnimationFrame(gameLoop)

    </script>
</body>

</html>
