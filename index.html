<html>
    <head> 
        <title>WOW</title>
    </head>
    <body>
        <canvas id="canv" width="500" height="500">
        </canvas>
        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")

            // signal to context i am going to draw something
            ctx.save()

            // set Center of object
            ctx.translate(250, 250)
            
            // draw a triangle at the center of the 50, 50
            ctx.lineTo(0, -100)

            ctx.lineTo(0, 100)
            
            ctx.lineTo(-100, 100)
            
            ctx.lineTo(50, 140)

            ctx.lineTo(87, 1)

            ctx.lineTo(40, 97)

            ctx.fillStyle = "turquoise"
            ctx.fill()
            
            

            // signal that i am done drawing 
            ctx.restore()
        </script>
    </body>
</html>
