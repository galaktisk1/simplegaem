<html>

<head>
    <title>GameLoop</title>
    <style>
        * {
            margin:0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="canv">
    </canvas>
    <script src="../engine/Vector2.js"></script>
    <script src="../engine/Input.js"></script>
    <script src="../engine/Engine.js"></script>
    <script>

        // set the position of the object
        let position = new Vector2(250, 250)

        

        // update loop
        function update() {
            // console.log(Input.keysDown)

            // issue for later, if you move diagonally, it adds both x and y, so the speed is faster than moving in one direction.
            if (Input.keysDown.includes("ArrowUp") || Input.keysDown.includes("KeyW")) {
                position.y -= 1
            }
            if (Input.keysDown.includes("ArrowDown") || Input.keysDown.includes("KeyS")) {
                position.y += 1
            }
            if (Input.keysDown.includes("ArrowLeft") || Input.keysDown.includes("KeyA")) {
                position.x -= 1
            }
            if (Input.keysDown.includes("ArrowRight") || Input.keysDown.includes("KeyD")) {
                position.x += 1
            }
        }

        function draw(ctx) {
            // signal to context i am going to draw something
            ctx.save()

            // set Center of object
            ctx.translate(position.x, position.y)
            // draw a shape at the center
            ctx.lineTo(0, -100)
            ctx.lineTo(-80, 50)
            ctx.lineTo(-40, 100)
            ctx.lineTo(40, 100)
            ctx.lineTo(80, 50)

            ctx.fillStyle = "turquoise"
            ctx.fill()
            // signal that i am done drawing 
            ctx.restore()
        }
    Engine.start()

    </script>
</body>

</html>
